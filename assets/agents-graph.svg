<svg width="1800" height="640" viewBox="0 0 1800 640" xmlns="http://www.w3.org/2000/svg" font-family="'Instrument Sans', Helvetica, Arial, sans-serif">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Instrument Sans', Helvetica, Arial, sans-serif; }
      .flow { stroke-dasharray: 5 8; animation: flow 1.8s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -26; } }
      .node-bob { animation: bob 4.2s ease-in-out infinite; }
      .node-bob.d2 { animation-delay: -0.7s; }
      .node-bob.d3 { animation-delay: -1.4s; }
      .node-bob.d4 { animation-delay: -2.1s; }
      .node-bob.d5 { animation-delay: -2.8s; }
      .node-bob.d6 { animation-delay: -3.5s; }
      @keyframes bob {
        0%, 100% { transform: translateY(0px); }
        50%      { transform: translateY(-4px); }
      }
      .hub-breathe { animation: breathe 3.2s ease-in-out infinite; transform-origin: 1130px 320px; }
      @keyframes breathe {
        0%, 100% { transform: scale(1); }
        50%      { transform: scale(1.025); }
      }
    </style>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#151717" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1800" height="640" rx="28" fill="#e8eae9"/>

  <!-- Left: text -->
  <text x="75" y="200" fill="#525957" font-size="16" font-weight="600" letter-spacing="2.5">DATA &amp; AI ENGINEER</text>
  <text x="72" y="266" fill="#151717" font-size="62" font-weight="500" letter-spacing="-1.5">My personal</text>
  <text x="72" y="331" fill="#151717" font-size="62" font-weight="500" letter-spacing="-1.5">agents.</text>
  <text x="75" y="380" fill="#525957" font-size="19" font-weight="400">An LLM agent reads context on a schedule</text>
  <text x="75" y="405" fill="#525957" font-size="19" font-weight="400">and turns it into real-world action —</text>
  <text x="75" y="430" fill="#525957" font-size="19" font-weight="400">from a haircut to a house.</text>

  <!-- connecting lines (elliptical hexagon, 60° apart) -->
  <g stroke="#b6bab7" stroke-width="2" class="flow">
    <line x1="1130" y1="320" x2="1130" y2="110"/>
    <line x1="1130" y1="320" x2="1356" y2="219"/>
    <line x1="1130" y1="320" x2="1356" y2="421"/>
    <line x1="1130" y1="320" x2="1130" y2="490"/>
    <line x1="1130" y1="320" x2="904" y2="421"/>
    <line x1="1130" y1="320" x2="904" y2="219"/>
  </g>

  <!-- hub -->
  <g class="hub-breathe">
    <circle cx="1130" cy="320" r="92" fill="#151717" filter="url(#soft)"/>
    <text x="1130" y="308" text-anchor="middle" font-size="38">🧠</text>
    <text x="1130" y="347" text-anchor="middle" fill="#f5f6f5" font-size="17" font-weight="600" letter-spacing="0.3">LLM AGENT</text>
  </g>

  <!-- Node: Barber Booking (top) -->
  <g class="node-bob d1">
    <circle cx="1130" cy="110" r="62" fill="#ffffff" stroke="#151717" stroke-width="2" filter="url(#soft)"/>
    <text x="1130" y="124" text-anchor="middle" font-size="32">✂️</text>
    <text x="1130" y="187" text-anchor="middle" fill="#151717" font-size="18" font-weight="600">Barber Booking</text>
  </g>

  <!-- Node: Health Tracking (upper-right) -->
  <g class="node-bob d2">
    <circle cx="1356" cy="219" r="62" fill="#ffffff" stroke="#151717" stroke-width="2" filter="url(#soft)"/>
    <text x="1356" y="233" text-anchor="middle" font-size="32">⌚</text>
    <text x="1438" y="196" text-anchor="start" fill="#151717" font-size="18" font-weight="600">Health Tracking</text>
  </g>

  <!-- Node: Nutrition Coach (lower-right) -->
  <g class="node-bob d3">
    <circle cx="1356" cy="421" r="62" fill="#ffffff" stroke="#151717" stroke-width="2" filter="url(#soft)"/>
    <text x="1356" y="435" text-anchor="middle" font-size="32">🥗</text>
    <text x="1438" y="443" text-anchor="start" fill="#151717" font-size="18" font-weight="600">Nutrition Coach</text>
  </g>

  <!-- Node: Home Automation (bottom) -->
  <g class="node-bob d4">
    <circle cx="1130" cy="490" r="66" fill="#ffffff" stroke="#151717" stroke-width="2" filter="url(#soft)"/>
    <text x="1130" y="505" text-anchor="middle" font-size="34">🏠</text>
    <text x="1130" y="577" text-anchor="middle" fill="#151717" font-size="18" font-weight="600">Home Automation</text>
  </g>

  <!-- Node: Gym Reimbursement (lower-left) -->
  <g class="node-bob d5">
    <circle cx="904" cy="421" r="62" fill="#ffffff" stroke="#151717" stroke-width="2" filter="url(#soft)"/>
    <text x="904" y="435" text-anchor="middle" font-size="32">🏋️</text>
    <text x="822" y="443" text-anchor="end" fill="#151717" font-size="18" font-weight="600">Gym Reimbursement</text>
  </g>

  <!-- Node: Accounting Assistant (upper-left) -->
  <g class="node-bob d6">
    <circle cx="904" cy="219" r="62" fill="#ffffff" stroke="#151717" stroke-width="2" filter="url(#soft)"/>
    <text x="904" y="233" text-anchor="middle" font-size="32">🧾</text>
    <text x="822" y="196" text-anchor="end" fill="#151717" font-size="18" font-weight="600">Accounting Assistant</text>
  </g>
</svg>
